<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanaric YouTube Karaoke</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Kanaric Karaoke</h1>
    <label>本機網址 <input id="baseUrl" type="url" value="http://127.0.0.1:5720" autocomplete="off"></label>

  </main>
  <script src="popup.js"></script>
</body>
</html>
